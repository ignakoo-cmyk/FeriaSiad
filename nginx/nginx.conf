# ── UAH Face AI Platform — Nginx Configuration ───────────────────────
# Funciones: reverse proxy, TLS 1.3, HSTS, rate limiting, caché de assets
# ──────────────────────────────────────────────────────────────────────

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Ocultar versión de Nginx en respuestas
    server_tokens off;

    # ── Timeouts (previene ataques Slowloris) ────────────────────────
    client_body_timeout    12s;
    client_header_timeout  12s;
    keepalive_timeout      15s;
    send_timeout           10s;
    client_max_body_size   2m;

    # ── Rate Limiting (capa Nginx, complementa Express) ──────────────
    # Zona para limitar por IP: 10MB almacena ~160k IPs
    limit_req_zone  $binary_remote_addr zone=api:10m      rate=10r/s;
    limit_req_zone  $binary_remote_addr zone=proxy:10m    rate=2r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ── Compresión gzip ──────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1000;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # ── Caché proxy para model weights e assets estáticos ────────────
    proxy_cache_path /var/cache/nginx
                     levels=1:2
                     keys_zone=static_cache:20m
                     max_size=500m
                     inactive=7d
                     use_temp_path=off;

    # ── Upstream Node.js ─────────────────────────────────────────────
    upstream faceai_backend {
        server uah-faceai:3001;
        keepalive 32;
    }

    # ── Redirect HTTP → HTTPS ────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── Servidor HTTPS principal ─────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name localhost;   # Cambiar por el dominio real

        # Certificados TLS (generados con: openssl req -x509 -nodes -days 365 ...)
        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        # Solo TLS 1.2 y 1.3
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # ── Cabeceras de seguridad HTTP ──────────────────────────────
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff"                              always;
        add_header X-Frame-Options           "SAMEORIGIN"                           always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"      always;
        add_header Permissions-Policy        "camera=self, microphone=self"         always;

        # ── Rate limiting global ─────────────────────────────────────
        limit_req  zone=api burst=30 nodelay;
        limit_conn conn_limit 20;

        # ── Caché agresiva para model weights y bundles JS ───────────
        location ~* \.(bin|shard|wasm)$ {
            proxy_pass              http://faceai_backend;
            proxy_http_version      1.1;
            proxy_set_header        Host $host;
            proxy_cache             static_cache;
            proxy_cache_valid       200 7d;
            proxy_cache_use_stale   error timeout updating http_500 http_502 http_503;
            proxy_cache_background_update on;
            add_header              X-Cache-Status $upstream_cache_status;
            add_header              Cache-Control "public, max-age=604800, immutable";
        }

        location ~* \.js$ {
            proxy_pass              http://faceai_backend;
            proxy_http_version      1.1;
            proxy_set_header        Host $host;
            proxy_cache             static_cache;
            proxy_cache_valid       200 1d;
            proxy_cache_use_stale   error timeout;
            add_header              X-Cache-Status $upstream_cache_status;
        }

        # ── Rate limiting estricto para el proxy de imágenes ─────────
        location = /fetch_external_image {
            limit_req zone=proxy burst=5 nodelay;
            proxy_pass          http://faceai_backend;
            proxy_http_version  1.1;
            proxy_set_header    Host $host;
            proxy_set_header    X-Real-IP $remote_addr;
            proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
            proxy_read_timeout  15s;
        }

        # ── Bloquear acceso externo a /metrics (solo interno) ────────
        location = /metrics {
            allow 172.16.0.0/12;   # Red Docker interna
            allow 127.0.0.1;
            deny  all;
        }

        # ── Proxy general ────────────────────────────────────────────
        location / {
            proxy_pass             http://faceai_backend;
            proxy_http_version     1.1;
            proxy_set_header       Upgrade $http_upgrade;
            proxy_set_header       Connection "upgrade";
            proxy_set_header       Host $host;
            proxy_set_header       X-Real-IP $remote_addr;
            proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto $scheme;
            proxy_read_timeout     30s;
            proxy_connect_timeout  5s;
            proxy_send_timeout     30s;
            proxy_buffering        on;
            proxy_buffer_size      8k;
            proxy_buffers          8 16k;
        }
    }
}
